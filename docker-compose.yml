services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev  # 開発用の Dockerfile を指定
    working_dir: /app
    volumes:
      - .:/app
      - bundle_data:/usr/local/bundle
    ports:
      - "3003:3000"
    command: bash -c "bundle exec rails db:prepare && rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/high_low_development
    tty: true
    stdin_open: true

  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: high_low_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  bundle_data:
